# SwissHub Bot WebApp - nginx Reverse Proxy
#
# Ablegen unter /etc/nginx/sites-available/system.swisshub.gg.conf und
# verlinken nach /etc/nginx/sites-enabled/. Die TLS-Zeilen werden von
# `certbot --nginx` automatisch ergaenzt bzw. koennen manuell gesetzt werden.
#
#   ln -s /etc/nginx/sites-available/system.swisshub.gg.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

# HTTP -> HTTPS (Certbot legt hier zusaetzlich seinen ACME-Pfad ab)
server {
    listen 80;
    listen [::]:80;
    server_name system.swisshub.gg;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name system.swisshub.gg;

    # --- TLS (von Certbot verwaltet) -------------------------------------
    ssl_certificate     /etc/letsencrypt/live/system.swisshub.gg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/system.swisshub.gg/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SwissHubTLS:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Logs -------------------------------------------------------------
    access_log /var/log/nginx/swisshub-access.log;
    error_log  /var/log/nginx/swisshub-error.log;

    # Formulare sind klein. Die grossen Uebertragungen sind die drei
    # Import-Assistenten, die eine alte SQLite-Datenbank entgegennehmen:
    # Level bis 64 MB, Jail und Spielersuche bis je 32 MB. Dazu der
    # Logo-Upload mit 5 MB.
    #
    # Diese Grenze muss ueber der groessten davon liegen, sonst lehnt nginx
    # die Datei ab, bevor die Anwendung sie ueberhaupt sieht - und der
    # Fehler waere schwer zu deuten. Die eigentliche Pruefung macht ohnehin
    # die Anwendung: jeder Endpunkt kennt seine eigene Obergrenze, prueft die
    # Signatur der Datei und haengt an einem Rate Limit.
    client_max_body_size 72m;

    # Serverkennung nicht preisgeben.
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Diese Header braucht die WebApp: TRUST_PROXY=true wertet
        # X-Forwarded-For fuer Rate Limits und Audit Log aus, X-Forwarded-Proto
        # sorgt fuer korrekte https-URLs.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Sicherheitsheader (CSP, HSTS, ...) setzt die WebApp selbst - sie
        # werden hier bewusst nicht ueberschrieben.
        proxy_buffering off;
    }

    # Hochgeladene Clipdateien.
    #
    # Die einzige Uebertragung, die um eine Groessenordnung ueber allem
    # anderen liegt: ein Clip darf im Dashboard bis 500 MB erlaubt werden
    # (`VIDEO_MAX_BYTES_GRENZE`). Die globale Grenze auf diesen Wert zu heben
    # hiesse, jedem Endpunkt ein halbes Gigabyte zu erlauben - deshalb steht
    # sie hier, wo sie gebraucht wird.
    #
    # Welche Grenze wirklich gilt, entscheidet trotzdem die Anwendung: sie
    # liest `uploadMaxMb` aus den Moduleinstellungen (Vorgabe 100 MB) und
    # lehnt alles darueber ab. Diese Zahl ist nur das Dach, damit nginx die
    # Uebertragung nicht mit 413 abbricht, bevor SwissHub sie ueberhaupt
    # sieht.
    location = /api/clips/upload {
        client_max_body_size 512m;
        # Eine 100-MB-Datei auf einer Haushaltsleitung braucht Minuten. Die
        # 60 Sekunden aus `location /` waeren hier ein Abbruch mitten im
        # Hochladen.
        client_body_timeout 300s;

        proxy_pass http://127.0.0.1:3000/api/clips/upload;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Der Health Check muss nicht in den Zugriffslogs landen.
    location = /api/health {
        proxy_pass http://127.0.0.1:3000/api/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
