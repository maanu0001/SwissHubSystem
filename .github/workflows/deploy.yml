name: Deploy SwissHub Production

on:
  push:
    branches:
      - production

concurrency:
  group: swisshub-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    # Die datenbankgestützten Tests laufen gegen ein echtes PostgreSQL. Ohne
    # `SWISSHUB_TEST_DATABASE_URL` überspringen sie sich selbst - dann wären
    # rund hundert Prüfungen grün, ohne je gelaufen zu sein.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: swisshub
          POSTGRES_PASSWORD: swisshub
          POSTGRES_DB: swisshub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swisshub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Wegwerfwerte allein für Typecheck, Tests und Build. Sie erreichen
      # weder Discord noch einen Zahlungsanbieter: `DEV_MOCK_DISCORD` schaltet
      # das Gateway auf die Attrappe, und `NODE_ENV` bleibt `test`.
      NODE_ENV: test
      DATABASE_URL: postgresql://swisshub:swisshub@localhost:5432/swisshub
      SHADOW_DATABASE_URL: postgresql://swisshub:swisshub@localhost:5432/swisshub_shadow
      SWISSHUB_TEST_DATABASE_URL: postgresql://swisshub:swisshub@localhost:5432/swisshub
      AUTH_SECRET: ci-nur-fuer-die-pipeline-mindestens-32-zeichen-lang
      SESSION_SECRET: ci-nur-fuer-die-pipeline-mindestens-32-zeichen-lang
      DISCORD_BOT_TOKEN: MTAwMDAwMDAwMDAwMDAwMDAw.Gci000.ci-attrappe-kein-echter-token
      DISCORD_CLIENT_ID: '100000000000000000'
      DISCORD_CLIENT_SECRET: ci-attrappe-kein-echtes-secret
      DISCORD_GUILD_ID: '100000000000000002'
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DEV_MOCK_DISCORD: 'true'
      PAYMENT_PROVIDER: mock
      PAYMENT_API_KEY: ci-attrappe
      PAYMENT_WEBHOOK_SECRET: ci-attrappe
      MUSIC_RUNTIME_KEY: ci-attrappe

    # Was der Deploy-Job wissen muss: braucht dieses Deployment einen
    # Wiederherstellungspunkt, bevor es migriert?
    outputs:
      braucht_recovery_point: ${{ steps.migrationen.outputs.braucht_recovery_point }}
      migrations_bericht: ${{ steps.migrationen.outputs.bericht }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Die Bewertung vergleicht mit dem vorherigen Stand von `production`.
          # Ohne Historie gibt es nichts zu vergleichen, und der Vergleich
          # faellt auf «alle Migrationen» zurueck - das ergaebe bei jedem
          # Deployment ein unnoetiges Backup.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      # ---------------------------------------------------------------------
      # Braucht dieses Deployment ein Netz?
      #
      # Nicht jedes. Die meisten Deployments aendern nur Quelltext, und ein
      # Basis-Backup davor schuetzt vor nichts und kostet Minuten - ein
      # Schritt, der jedes Ausrollen verzoegert, wird irgendwann abgeschaltet.
      #
      # `scripts/migrationen-pruefen.ts` liest das SQL der neu hinzugekommenen
      # Migrationen und fragt, ob eine davon etwas WEGNIMMT oder etwas
      # ERZWINGT. Nur dann reicht ein Git-Rollback nicht: er stellt kein altes
      # Datenbankschema wieder her.
      #
      # Was das Skript nicht erkennt, stuft es als `unbekannt` ein - und das
      # wird wie `destruktiv` behandelt. Falsch positiv kostet ein Backup,
      # falsch negativ kostet Daten.
      # ---------------------------------------------------------------------
      - name: Migrationen bewerten
        id: migrationen
        run: |
          set -uo pipefail

          # `github.event.before` ist der Stand von `production` vor diesem
          # Push. Bei einem neuen Branch oder einem erzwungenen Push steht dort
          # eine Nullkennung - dann wird ohne Vergleich bewertet.
          vorher='${{ github.event.before }}'
          if [ -z "$vorher" ] || [ "$vorher" = '0000000000000000000000000000000000000000' ] \
             || ! git cat-file -e "$vorher^{commit}" 2>/dev/null; then
            echo "Kein vergleichbarer Vorgaengerstand - es werden alle Migrationen bewertet."
            vorher=''
          fi

          if [ -n "$vorher" ]; then
            npx tsx scripts/migrationen-pruefen.ts "$vorher" > migrationen.json
          else
            npx tsx scripts/migrationen-pruefen.ts > migrationen.json
          fi
          status=$?

          cat migrationen.json

          if [ "$status" -eq 2 ]; then
            echo "::error::Die Bewertung der Migrationen war nicht moeglich."
            exit 1
          fi

          if [ "$status" -eq 1 ]; then
            echo 'braucht_recovery_point=ja' >> "$GITHUB_OUTPUT"
            echo "::warning::Dieses Deployment enthaelt Migrationen, die nicht vorwaertskompatibel sind. Vor der Migration wird ein Wiederherstellungspunkt verlangt."
          else
            echo 'braucht_recovery_point=nein' >> "$GITHUB_OUTPUT"
          fi

          # Die Zusammenfassung als Ausgabe, damit sie im Deploy-Log steht.
          {
            echo 'bericht<<ENDE_DES_BERICHTS'
            python3 -c "import json;print(json.load(open('migrationen.json'))['zusammenfassung'])"
            echo 'ENDE_DES_BERICHTS'
          } >> "$GITHUB_OUTPUT"

          # Und in die Zusammenfassung des Lauf, damit man sie ohne Log sieht.
          {
            echo '## Migrationen'
            echo
            python3 -c "import json;print(json.load(open('migrationen.json'))['zusammenfassung'])"
            echo
            python3 - <<'PYTHON'
          import json
          daten = json.load(open('migrationen.json'))
          if daten['befunde']:
              print('### Nicht vorwärtskompatibel')
              print()
              for befund in daten['befunde']:
                  print('- **%s** (%s)' % (befund['name'], befund['bewertung']))
                  for grund in befund['gruende']:
                      print('  - %s' % grund)
                  for unbekannt in befund['unbekannt'][:3]:
                      print('  - nicht erkannt: `%s`' % unbekannt)
          PYTHON
          } >> "$GITHUB_STEP_SUMMARY"

      # Die Migrationen einmal vollstaendig auf eine leere Datenbank anwenden.
      # Ein Schema-Entwurf, der nur in der Datei stimmt, faellt sonst erst beim
      # Deployment auf - also genau dann, wenn niemand mehr eingreifen kann.
      - name: Apply migrations
        run: npm run db:deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Die Voice-Laufzeit ist Python und lief bisher ausserhalb jeder
      # Pruefung. Ihre Tests decken genau die Fehler ab, an denen die
      # Wiedergabe im Betrieb gescheitert ist - ungeprueft waeren sie wertlos.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install music runtime dependencies
        run: pip install -r apps/music-runtime/requirements.txt pytest pytest-asyncio

      - name: Music runtime tests
        working-directory: apps/music-runtime
        run: pytest -q

      - name: Production build
        run: npm run build

  deploy:
    name: Deploy Production
    # Ohne `needs` liefe das Deployment parallel zur Prüfung. Erst wenn Lint,
    # Typecheck, Tests und Build durch sind, darf etwas auf den Server.
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to SwissHub server
        uses: appleboy/ssh-action@v1
        env:
          BRAUCHT_RECOVERY_POINT: ${{ needs.validate.outputs.braucht_recovery_point }}
          MIGRATIONS_BERICHT: ${{ needs.validate.outputs.migrations_bericht }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          command_timeout: 45m
          # Die Bewertung aus dem validate-Job. `envs` gibt genau diese
          # Variablen in die SSH-Sitzung; alles andere bleibt draussen.
          envs: BRAUCHT_RECOVERY_POINT,MIGRATIONS_BERICHT
          script: |
            set -euo pipefail

            cd /opt/swisshub
            COMPOSE="docker compose -f docker-compose.prod.yml"

            echo "=== SwissHub Production Deployment ==="

            echo "1. Lade neuesten Production-Stand ..."
            git fetch origin production
            git checkout production
            git reset --hard origin/production
            echo "   Stand: $(git rev-parse --short HEAD) $(git log -1 --pretty=%s)"

            # ---------------------------------------------------------------
            # 2. Hat dieses Deployment ein Netz?
            #
            # Nur wenn es eines braucht. `BRAUCHT_RECOVERY_POINT` kommt aus der
            # Bewertung der neu hinzugekommenen Migrationen im validate-Job: sie
            # liest deren SQL und fragt, ob eine davon etwas WEGNIMMT oder
            # ERZWINGT.
            #
            # Warum nicht immer: die meisten Deployments aendern nur Quelltext.
            # Ein Basis-Backup davor schuetzt vor nichts und kostet Minuten -
            # und ein Schritt, der jedes Ausrollen verzoegert, wird irgendwann
            # abgeschaltet. Eine Sicherung, die abgeschaltet wird, weil sie im
            # Weg ist, ist keine.
            #
            # Warum ueberhaupt: ein Git-Rollback stellt kein altes
            # Datenbankschema wieder her. Eine Migration, die eine Spalte
            # loescht, ist ohne Wiederherstellungspunkt ein Schreibvorgang ohne
            # Netz.
            # ---------------------------------------------------------------
            echo "2. Pruefe das Netz fuer die Datenbankmigration ..."
            echo "   Bewertung: ${MIGRATIONS_BERICHT:-keine Angabe}"

            if [ "${BRAUCHT_RECOVERY_POINT:-nein}" = "ja" ]; then
              if ! command -v swisshub-backup >/dev/null 2>&1; then
                echo "FEHLER: Dieses Deployment enthaelt eine Migration, die nicht"
                echo "        vorwaertskompatibel ist - und auf diesem Server ist keine"
                echo "        Backup-Anlage eingerichtet (swisshub-backup fehlt)."
                echo
                echo "        Ein Git-Rollback stellt kein altes Datenbankschema wieder"
                echo "        her. Ohne Wiederherstellungspunkt gibt es keinen Weg zurueck."
                echo
                echo "        Einrichten: sudo bash deploy/backup/install.sh"
                echo "        Siehe docs/BACKUP.md."
                echo
                echo "        Ausdruecklich uebergehen (und wissen, was fehlt):"
                echo "          SWISSHUB_DEPLOY_OHNE_NETZ=ich-weiss-was-ich-tue in /opt/swisshub/.env"
                if [ "${SWISSHUB_DEPLOY_OHNE_NETZ:-}" = "ich-weiss-was-ich-tue" ]; then
                  echo "   UEBERGANGEN auf ausdruecklichen Wunsch."
                else
                  exit 1
                fi
              else
                echo "   Lege einen Wiederherstellungspunkt an ..."
                if sudo -n swisshub-backup vor-deployment; then
                  echo "   Netz gespannt."
                else
                  echo "FEHLER: Es liess sich kein verlaesslicher Wiederherstellungspunkt"
                  echo "        anlegen. Die Meldungen darueber sagen, was fehlt."
                  echo
                  echo "        Dieses Deployment wird NICHT ausgerollt. Eine Migration, die"
                  echo "        etwas wegnimmt, ohne dass man zurueck kann, ist der Fehler,"
                  echo "        gegen den dieses Tor gebaut ist."
                  if [ "${SWISSHUB_DEPLOY_OHNE_NETZ:-}" = "ich-weiss-was-ich-tue" ]; then
                    echo "   UEBERGANGEN auf ausdruecklichen Wunsch."
                  else
                    exit 1
                  fi
                fi
              fi
            else
              echo "   Nicht noetig: keine Migration, die etwas wegnimmt oder erzwingt."
              echo "   Ein Git-Rollback genuegt, um zurueckzukommen."
            fi

            echo "9. Baue Docker Images ..."
            $COMPOSE build

            echo "3. Starte Migration und Services ..."
            $COMPOSE up -d --remove-orphans

            # ---------------------------------------------------------------
            # 4. Laeuft jeder Dienst wirklich auf dem frisch gebauten Abbild?
            #
            # Compose entscheidet selbst, ob ein Container ersetzt werden muss,
            # und lag damit schon daneben: der Bot lief nach einem Deployment
            # weiter auf dem alten Abbild. Statt blind alles neu zu starten -
            # das kostet bei jedem Deployment unnoetig Ausfallzeit - wird hier
            # verglichen und nur ersetzt, was tatsaechlich abweicht.
            # ---------------------------------------------------------------
            echo "4. Pruefe, ob die Container auf den neuen Abbildern laufen ..."
            for dienst in web bot music-runtime; do
              soll=$(docker image inspect --format '{{.Id}}' "swisshub-${dienst}:latest")
              behaelter=$($COMPOSE ps -q "$dienst" || true)
              ist=""
              if [ -n "$behaelter" ]; then
                ist=$(docker inspect --format '{{.Image}}' "$behaelter")
              fi

              if [ "$soll" != "$ist" ]; then
                echo "   $dienst laeuft nicht auf dem neuen Abbild - wird ersetzt."
                $COMPOSE up -d --force-recreate --no-deps "$dienst"
              else
                echo "   $dienst ist aktuell."
              fi
            done

            echo "5. Pruefe die Migration ..."
            migrate_container=$($COMPOSE ps -aq migrate | head -n1)
            if [ -z "$migrate_container" ]; then
              echo "FEHLER: Es gibt keinen Migrations-Container."
              exit 1
            fi
            migrate_code=$(docker inspect --format '{{.State.ExitCode}}' "$migrate_container")
            if [ "$migrate_code" != "0" ]; then
              echo "FEHLER: Die Migration ist mit Code $migrate_code gescheitert."
              docker logs --tail 100 "$migrate_container"
              exit 1
            fi
            echo "   Migration sauber durchgelaufen."

            # ---------------------------------------------------------------
            # 6. Warten, bis die Dienste gesund sind.
            #
            # Nicht `sleep 20` und hoffen: der Bot meldet sich wegen Anmeldung
            # und Slash-Command-Registrierung erst nach gut einer Minute, und
            # ein fester Schlaf waere entweder zu kurz oder verschenkte Zeit.
            # ---------------------------------------------------------------
            echo "6. Warte auf gesunde Container ..."
            warte_auf_gesund() {
              dienst="$1"
              grenze=$(( $(date +%s) + 300 ))
              while true; do
                behaelter=$($COMPOSE ps -q "$dienst" || true)
                if [ -z "$behaelter" ]; then
                  echo "FEHLER: $dienst laeuft nicht."
                  exit 1
                fi

                zustand=$(docker inspect --format '{{.State.Status}}' "$behaelter")
                gesundheit=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$behaelter")

                if [ "$zustand" != "running" ]; then
                  echo "FEHLER: $dienst ist $zustand."
                  docker logs --tail 100 "$behaelter"
                  exit 1
                fi
                if [ "$gesundheit" = "healthy" ]; then
                  echo "   $dienst: healthy"
                  return 0
                fi
                if [ "$gesundheit" = "none" ]; then
                  echo "   $dienst: laeuft (ohne Gesundheitscheck)"
                  return 0
                fi
                if [ "$(date +%s)" -ge "$grenze" ]; then
                  echo "FEHLER: $dienst wurde nicht gesund (zuletzt: $gesundheit)."
                  docker logs --tail 100 "$behaelter"
                  exit 1
                fi
                sleep 5
              done
            }

            warte_auf_gesund web
            warte_auf_gesund bot
            warte_auf_gesund music-runtime

            echo "7. Uebersicht:"
            $COMPOSE ps

            echo "8. Pruefe die WebApp von aussen ..."
            curl --fail --silent --show-error --max-time 30 https://system.swisshub.gg > /dev/null
            echo "   system.swisshub.gg antwortet."

            echo "=== DEPLOYMENT ERFOLGREICH ==="
